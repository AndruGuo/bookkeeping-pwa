<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.andru.de5.net; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="记账本">
<meta name="theme-color" content="#EFF6FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14141A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<title>记账本</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 离线横幅 -->
  <div id="offlineBanner" class="offline-banner hidden">⚠️ 离线 - 无法同步</div>
  <!-- 顶部导航 -->
  <header class="nav-bar">
    <button id="monthPrev" class="nav-btn" aria-label="上一月">‹</button>
    <h1 id="navTitle">记账本</h1>
    <button id="monthNext" class="nav-btn" aria-label="下一月">›</button>
  </header>

  <main id="pageContainer" class="page-container"></main>

  <!-- 底部标签栏 -->
    <nav class="tab-bar">
    <button class="tab-item active" data-tab="home">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="14" height="16" rx="2"/><path d="M17 8h2.5A1.5 1.5 0 0 1 21 9.5V19a2 2 0 0 1-2 2H5"/><path d="M6.5 9h7M6.5 12.5h5"/></svg></span><span>明细</span>
    </button>
    <button class="tab-item" data-tab="stats">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M12 3v9h9"/></svg></span><span>统计</span>
    </button>
    <button class="tab-add" id="addBtn" aria-label="记一笔">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    
    <button class="tab-item" data-tab="categories">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V5a2 2 0 0 1 2-2h8l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5" fill="currentColor" stroke="none"/></svg></span><span>分类</span>
    </button>
    <button class="tab-item" data-tab="settings">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></span><span>设置</span>
    </button>
  </nav>

  <!-- 记一笔弹层 -->
  <div id="addSheet" class="sheet-mask hidden">
    <div class="sheet">
      <div class="sheet-header">
        <button id="addCancel" class="text-btn">取消</button>
        <h2>记一笔</h2>
        <button id="addSave" class="text-btn primary">保存</button>
      </div>
      <div class="seg-tabs">
        <button id="segExpense" class="seg active" data-type="0">支出</button>
        <button id="segIncome" class="seg" data-type="1">收入</button>
      </div>
      <div class="amount-row">
        <span class="currency">¥</span>
        <input id="amountInput" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
      </div>
      <div class="quick-amounts">
        <button class="qa" data-amt="10">+10</button>
        <button class="qa" data-amt="50">+50</button>
        <button class="qa" data-amt="100">+100</button>
        <button class="qa" id="qaCustom">自定义</button>
      </div>
      <div id="addCategories" class="icon-grid"></div>
      <div class="form-row">
        <label>备注</label>
        <input id="noteInput" type="text" placeholder="点击填写备注" maxlength="50">
      </div>
      <div class="form-row">
        <label>日期</label>
        <span class="date-row"><button id="dateToday" class="mini-btn" type="button">今天</button><input id="dateInput" type="date"></span>
      </div>
    </div>
  </div>

  <!-- 通用确认弹窗 -->
  <div id="confirmDialog" class="sheet-mask hidden">
    <div class="dialog">
      <p id="confirmText"></p>
      <div class="dialog-btns">
        <button id="confirmCancel" class="dialog-btn">取消</button>
        <button id="confirmOk" class="dialog-btn danger">确定</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="js/vendor/chart.umd.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
