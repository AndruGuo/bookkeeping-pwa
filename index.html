<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>try{if(!localStorage.getItem('bk_token')){document.write('<style>.page-container,.tab-bar,.nav-bar,#offlineBanner{display:none!important}</style>')}}catch(e){}</script>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.andru.de5.net; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="记账本">
<meta name="theme-color" content="#FFD835">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<title>记账本</title>
<link rel="stylesheet" href="css/style.css?v=65">
</head>
<body>
<div id="app">
  <!-- 离线横幅 -->
  <div id="offlineBanner" class="offline-banner hidden">⚠️ 离线 - 无法同步</div>
  <!-- 顶部导航（黄色头部，延伸到状态栏） -->
  <header class="nav-bar">
    <span class="nav-spacer" style="width:44px"></span>
    <button id="monthPrev" class="nav-btn" aria-label="上一月">‹</button>
    <h1 id="navTitle">记账本</h1>
    <button id="monthNext" class="nav-btn" aria-label="下一月">›</button>
    <span class="nav-spacer" style="width:44px"></span>
  </header>

  <main id="pageContainer" class="page-container"></main>
  <div id="pullLoader" class="pull-loader hidden"><span class="spinner"></span><span class="pull-text">正在同步…</span></div>

  <!-- 底部标签栏 -->
  <nav class="tab-bar">
      <nav class="tab-bar">
    <button class="tab-item active" data-tab="home">
      <span class="tab-icon"><svg viewBox="0 0 48 48"><path class="ic-fill" d="M10 8h20l8 6v26a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3V11a3 3 0 0 1 3-3z" fill="#fff" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/><path d="M30 8v6h8" fill="none" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/><path d="M15 20h14M15 26h14M15 32h9" stroke="#333" stroke-width="2.5" stroke-linecap="round"/></svg></span><span>明细</span>
    </button>
    <button class="tab-item" data-tab="stats">
      <span class="tab-icon"><svg viewBox="0 0 48 48"><circle class="ic-fill" cx="24" cy="24" r="17" fill="#fff" stroke="#9a9a9a" stroke-width="2.5"/><path d="M15 27l6-6 5 4 7-8" fill="none" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M33 17v5M33 17h-5" fill="none" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round"/></svg></span><span>统计</span>
    </button>
    <button class="tab-add" id="addBtn" aria-label="记一笔">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    
    <button class="tab-item" data-tab="categories">
      <span class="tab-icon"><svg viewBox="0 0 48 48"><circle class="ic-fill" cx="24" cy="22" r="14" fill="#fff" stroke="#9a9a9a" stroke-width="2.5"/><ellipse class="ic-fill" cx="24" cy="27" rx="21" ry="6" fill="#fff" stroke="#9a9a9a" stroke-width="2.5" transform="rotate(-12 24 27)"/></svg></span><span>发现</span>
    </button>
    <button class="tab-item" data-tab="settings">
      <span class="tab-icon"><svg viewBox="0 0 48 48"><circle class="ic-fill" cx="24" cy="16" r="8" fill="#fff" stroke="#9a9a9a" stroke-width="2.5"/><path class="ic-fill" d="M8 42c0-9 7-14 16-14s16 5 16 14" fill="#fff" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round"/></svg></span><span>我的</span>
    </button>
  </nav>

  <!-- 记一笔弹层 -->
  <div id="addSheet" class="sheet-mask hidden">
    <div class="sheet">
      <div class="sheet-header">
        <button id="addCancel" class="text-btn">取消</button>
        <h2>记一笔</h2>
        <button id="addSave" class="text-btn primary">保存</button>
      </div>
      <div class="seg-tabs">
        <button id="segExpense" class="seg active" data-type="0">支出</button>
        <button id="segIncome" class="seg" data-type="1">收入</button>
      </div>
      <div class="amount-row">
        <span class="currency">¥</span>
        <input id="amountInput" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
      </div>
      <div class="quick-amounts">
        <button class="qa" data-amt="10">+10</button>
        <button class="qa" data-amt="50">+50</button>
        <button class="qa" data-amt="100">+100</button>
        <button class="qa" id="qaCustom">自定义</button>
      </div>
      <div id="addCategories" class="icon-grid"></div>
      <div class="form-row">
        <label>备注</label>
        <input id="noteInput" type="text" placeholder="点击填写备注" maxlength="50">
      </div>
      <div class="form-row">
        <label>日期</label>
        <span class="date-chips" id="dateChips"><button type="button" class="chip active" data-day="0">今天</button><button type="button" class="chip" data-day="1">昨天</button><button type="button" class="chip" data-day="2">前天</button><input id="dateInput" type="hidden"></span>
      </div>
    </div>
  </div>

  <!-- 通用确认弹窗 -->
  <div id="confirmDialog" class="sheet-mask hidden">
    <div class="dialog">
      <p id="confirmText"></p>
      <div class="dialog-btns">
        <button id="confirmCancel" class="dialog-btn">取消</button>
        <button id="confirmOk" class="dialog-btn danger">确定</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="js/vendor/chart.umd.js"></script>
<script type="module" src="js/app.js?v=70"></script>
</body>
</html>
